<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Açougue - Painel Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com');
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #000;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.8s ease-in-out;
            overflow: hidden;
        }
        .promo-card {
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 8px solid #ea580c;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-white min-h-screen">

    <!-- PLAYER DE VÍDEO (CONFIGURÁVEL) -->
    <video id="video-player" class="fixed inset-0 w-full h-full object-cover z-50 hidden" muted playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <!-- PAINEL DE GESTÃO (OCULTO NO FULLSCREEN) -->
    <div id="admin-panel" class="relative z-10 p-6 bg-black/90 border-b border-orange-500 shadow-2xl mb-4">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold text-orange-500 uppercase tracking-widest">Gestão de Ofertas Açougue</h1>
                <button onclick="toggleFullscreen()" class="bg-orange-600 hover:bg-orange-700 px-6 py-2 rounded-full font-black text-sm transition-all">TELA CHEIA (F11)</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4 bg-white/5 rounded-xl">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Imagem de Fundo (Ex: fundo.jpg)</label>
                    <input id="bgUrl" type="text" placeholder="fundo.jpg" class="w-full bg-gray-800 p-2 rounded border border-gray-700 text-sm">
                    <button onclick="atualizarFundo()" class="w-full bg-gray-700 hover:bg-gray-600 text-[10px] py-2 rounded font-bold">APLICAR FUNDO</button>
                </div>
                
                <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-4 gap-2">
                    <input id="prodNome" type="text" placeholder="Ex: Picanha Argentina" class="md:col-span-2 bg-gray-800 p-2 rounded border border-gray-700">
                    <input id="prodPreco" type="text" placeholder="R$ 59,90" class="bg-gray-800 p-2 rounded border border-gray-700">
                    <button id="btnSalvar" onclick="salvarOferta()" class="bg-orange-600 hover:bg-orange-700 font-bold rounded uppercase text-sm">Salvar</button>
                </div>
            </div>
            <div id="lista-gestao" class="flex flex-wrap gap-2 mt-4"></div>
        </div>
    </div>

    <!-- ÁREA DE EXIBIÇÃO -->
    <div id="app-container" class="max-w-[1600px] mx-auto p-4 lg:p-8">
        <header class="flex justify-between items-center mb-8 bg-black/40 p-6 rounded-3xl backdrop-blur-md border border-white/10">
            <div class="flex items-center gap-8">
                <img id="logo-img" src="logo.png" onerror="this.src='https://placehold.co'" 
                     class="max-h-24 w-auto object-contain drop-shadow-2xl bg-white p-2 rounded-xl">
                <div>
                    <h2 class="text-6xl font-black italic tracking-tighter text-orange-500 uppercase leading-none">Ofertas <span class="text-white">do Dia</span></h2>
                    <p class="text-orange-400 font-bold tracking-[0.3em] text-sm mt-2">QUALIDADE GARANTIDA NO SEU AÇOUGUE</p>
                </div>
            </div>
            <div class="text-right">
                <p id="data-atual" class="text-5xl font-black tabular-nums"></p>
                <p class="text-orange-500 font-bold tracking-widest text-xl">SÓ HOJE</p>
            </div>
        </header>

        <!-- Grid de Ofertas (Paginado automaticamente) -->
        <div id="grid-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Os cards entrarão aqui via JS -->
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÕES DE TEMPO ---
        const TEMPO_CADA_PAGINA = 10000; // 10 segundos por grupo de carnes
        const PRODUTOS_POR_PAGINA = 4;   // 4 carnes por vez para ficar grande na tela
        
        let ofertas = JSON.parse(localStorage.getItem('ofertas_v4')) || [];
        let editIndex = -1;
        let paginaAtual = 0;
        let loopInterval;

        // --- LÓGICA DE INICIALIZAÇÃO ---
        window.onload = () => {
            const savedBg = localStorage.getItem('background_url') || 'fundo.jpg';
            document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${savedBg}')`;
            document.getElementById('bgUrl').value = savedBg;
            document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR');
            
            renderizarGestao();
            iniciarRotacao();
        };

        // --- GESTÃO DE DADOS ---
        function salvarOferta() {
            const nome = document.getElementById('prodNome').value;
            const preco = document.getElementById('prodPreco').value;
            if(!nome || !preco) return;

            if(editIndex > -1) {
                ofertas[editIndex] = { nome, preco };
                editIndex = -1;
                document.getElementById('btnSalvar').innerText = "Salvar";
            } else {
                ofertas.push({ nome, preco });
            }

            localStorage.setItem('ofertas_v4', JSON.stringify(ofertas));
            document.getElementById('prodNome').value = '';
            document.getElementById('prodPreco').value = '';
            renderizarGestao();
            iniciarRotacao(); // Reinicia para atualizar a grade
        }

        function atualizarFundo() {
            const url = document.getElementById('bgUrl').value;
            localStorage.setItem('background_url', url);
            document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${url}')`;
        }

        function remover(index) {
            ofertas.splice(index, 1);
            localStorage.setItem('ofertas_v4', JSON.stringify(ofertas));
            renderizarGestao();
            iniciarRotacao();
        }

        // --- MOTOR DE ROTAÇÃO (O CORAÇÃO DO PAINEL) ---
        function iniciarRotacao() {
            clearInterval(loopInterval);
            if (ofertas.length === 0) return;

            renderizarPagina();

            loopInterval = setInterval(() => {
                const totalPaginas = Math.ceil(ofertas.length / PRODUTOS_POR_PAGINA);
                paginaAtual++;

                if (paginaAtual >= totalPaginas) {
                    paginaAtual = 0;
                    exibirVideoPromocional();
                } else {
                    renderizarPagina();
                }
            }, TEMPO_CADA_PAGINA);
        }

        function renderizarPagina() {
            const inicio = paginaAtual * PRODUTOS_POR_PAGINA;
            const fim = inicio + PRODUTOS_POR_PAGINA;
            const itensExibir = ofertas.slice(inicio, fim);

            document.getElementById('grid-ofertas').innerHTML = itensExibir.map(item => `
                <div class="promo-card p-8 rounded-2xl flex flex-col items-center text-center shadow-2xl ring-1 ring-black/5">
                    <h3 class="text-gray-900 text-3xl font-black uppercase mb-6 leading-tight h-20 flex items-center">${item.nome}</h3>
                    <div class="flex items-start text-orange-600">
                        <span class="text-3xl font-bold mt-4 mr-1">R$</span>
                        <span class="text-9xl font-black tracking-tighter">${item.preco}</span>
                    </div>
                    <div class="w-full bg-orange-600 text-white mt-8 py-3 text-2xl font-black rounded-xl italic transform -skew-x-12 shadow-lg">
                        OFERTA IMBATÍVEL
                    </div>
                </div>
            `).join('');
        }

        function exibirVideoPromocional() {
            const video = document.getElementById('video-player');
            video.classList.remove('hidden');
            video.play();

            // Pausa o carrossel enquanto o vídeo passa
            clearInterval(loopInterval);

            video.onended = () => {
                video.classList.add('hidden');
                iniciarRotacao(); // Volta para a página 0 das ofertas
            };
        }

        function renderizarGestao() {
            document.getElementById('lista-gestao').innerHTML = ofertas.map((item, i) => `
                <div class="bg-white/10 p-2 rounded-lg text-[10px] flex gap-3 items-center border border-white/5">
                    <span class="font-bold text-orange-400">${item.nome}</span>
                    <button onclick="remover(${i})" class="text-red-500 font-bold">REMOVER</button>
                </div>
            `).join('');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('admin-panel').style.display = 'none';
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) document.getElementById('admin-panel').style.display = 'block';
        });
    </script>
</body>
</html>
