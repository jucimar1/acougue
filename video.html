<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Ofertas Dinâmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com');
        body { font-family: 'Inter', sans-serif; background: #000; overflow: hidden; }
        
        /* Camadas de exibição */
        #video-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }
        #interface-layer { position: relative; z-index: 20; min-height: 100vh; background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('fundo.jpg'); background-size: cover; }
        
        .promo-card { background: rgba(255, 255, 255, 0.95); border-bottom: 6px solid #ea580c; transform: skewX(-1deg); color: #1a1a1a; }
        .hidden-layer { display: none !important; }
    </style>
</head>
<body class="text-white">

    <!-- CAMADA DE VÍDEO (REPOSITÓRIO) -->
    <div id="video-layer">
        <video id="meuVideo" width="100%" height="100%" style="object-fit: cover;">
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- GESTOR (OCULTO NO FULLSCREEN) -->
    <div id="admin-panel" class="p-6 bg-black/90 border-b border-orange-500 relative z-30">
        <div class="max-w-7xl mx-auto flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h1 class="text-xl font-bold text-orange-500">Gestor do Painel</h1>
                <div class="flex gap-2">
                    <input id="tempoTroca" type="number" placeholder="Segundos p/ alternar" class="bg-gray-800 p-2 rounded text-sm w-40" value="15">
                    <button onclick="iniciarAutomacao()" class="bg-green-600 px-4 py-2 rounded font-bold text-xs">INICIAR PAINEL</button>
                    <button onclick="toggleFullscreen()" class="bg-orange-600 px-4 py-2 rounded font-bold text-xs">TELA CHEIA</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white/5 p-4 rounded-xl">
                <input id="prodNome" type="text" placeholder="Produto" class="bg-gray-800 p-2 rounded border border-gray-700">
                <input id="prodPreco" type="text" placeholder="Preço" class="bg-gray-800 p-2 rounded border border-gray-700">
                <button onclick="salvarOferta()" class="bg-orange-600 font-bold rounded">Salvar Produto</button>
            </div>
        </div>
    </div>

    <!-- CAMADA DE INTERFACE (OFERTAS) -->
    <div id="interface-layer" class="p-8">
        <header class="flex justify-between items-center mb-10 bg-black/30 p-6 rounded-3xl backdrop-blur-sm border border-white/10">
            <div class="flex items-center gap-8">
                <img src="logo.png" onerror="this.src='https://placehold.co'" class="max-h-24 bg-white p-2 rounded">
                <h2 class="text-6xl font-black italic text-orange-500 uppercase">Ofertas <span class="text-white">do Dia</span></h2>
            </div>
            <div class="text-right">
                <p id="data-atual" class="text-4xl font-black"></p>
                <p class="text-orange-500 font-bold tracking-widest uppercase">Qualidade Garantida</p>
            </div>
        </header>

        <div id="grid-ofertas" class="grid grid-cols-1 md:grid-cols-4 gap-8"></div>
    </div>

    <script>
        let ofertas = JSON.parse(localStorage.getItem('ofertas_v3')) || [];
        const videoLayer = document.getElementById('video-layer');
        const interfaceLayer = document.getElementById('interface-layer');
        const videoPlayer = document.getElementById('meuVideo');

        function salvarOferta() {
            const nome = document.getElementById('prodNome').value;
            const preco = document.getElementById('prodPreco').value;
            if(nome && preco) {
                ofertas.push({ nome, preco });
                localStorage.setItem('ofertas_v3', JSON.stringify(ofertas));
                renderizar();
            }
        }

        function renderizar() {
            document.getElementById('grid-ofertas').innerHTML = ofertas.map(item => `
                <div class="promo-card p-6 rounded-xl flex flex-col items-center text-center shadow-2xl">
                    <h3 class="text-2xl font-black uppercase mb-4 h-16 overflow-hidden">${item.nome}</h3>
                    <div class="flex items-start text-orange-600 font-black">
                        <span class="text-xl mt-2">R$</span>
                        <span class="text-7xl tracking-tighter">${item.preco}</span>
                    </div>
                </div>
            `).join('');
        }

        // LÓGICA DE ALTERNÂNCIA (O PULO DO GATO)
        function iniciarAutomacao() {
            const tempo = document.getElementById('tempoTroca').value * 1000;
            
            setInterval(() => {
                // Se o vídeo estiver oculto, mostra o vídeo e esconde as ofertas
                if (videoLayer.style.display === 'none') {
                    interfaceLayer.classList.add('hidden-layer');
                    videoLayer.style.display = 'block';
                    videoPlayer.play();
                    
                    // Quando o vídeo acabar, volta para as ofertas
                    videoPlayer.onended = () => {
                        videoLayer.style.display = 'none';
                        interfaceLayer.classList.remove('hidden-layer');
                    };
                }
            }, tempo);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('admin-panel').style.display = 'none';
            } else {
                document.exitFullscreen();
                document.getElementById('admin-panel').style.display = 'block';
            }
        }

        document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR');
        renderizar();
    </script>
</body>
</html>
