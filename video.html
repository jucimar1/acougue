<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Açougue - Versão Estabilizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: white; }
        .preco-valor { font-family: 'Oswald', sans-serif; }
        #monitor { background: #000; display: none; z-index: 9999; }
        .log-error { color: #ff4444; font-size: 10px; margin-top: 5px; }
        .log-success { color: #44ff44; font-size: 10px; margin-top: 5px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- PLAYER DE VÍDEO (MONITOR) -->
    <video id="monitor-video" class="fixed inset-0 w-full h-full object-cover hidden" muted></video>

    <!-- GESTOR ADM -->
    <div id="admin-panel" class="p-6 max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-black text-orange-500 italic uppercase">Gestão de Açougue</h1>
            <div class="flex gap-2">
                <button onclick="baixarDados()" class="bg-gray-700 px-4 py-2 rounded text-xs font-bold">ATUALIZAR LISTA</button>
                <button onclick="sincronizarGitHub()" class="bg-green-600 px-6 py-2 rounded-full font-bold uppercase text-xs">SINCRONIZAR COM GITHUB</button>
                <button onclick="iniciarMonitor()" class="bg-blue-600 px-6 py-2 rounded-full font-bold uppercase text-xs">INICIAR TV</button>
            </div>
        </header>

        <!-- CONFIG GITHUB -->
        <section class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Token GitHub (ghp_...)</label>
                    <input id="ghToken" type="password" class="w-full bg-black border border-gray-700 p-2 rounded text-sm text-orange-400">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase">Usuário/Repositório</label>
                    <input id="ghRepo" type="text" placeholder="usuario/repositorio" class="w-full bg-black border border-gray-700 p-2 rounded text-sm">
                </div>
            </div>
            <div id="api-status"></div>
        </section>

        <!-- CADASTRO E PREVIA -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-orange-500 font-bold text-sm uppercase">Adicionar Corte</h3>
                    <select id="filtroTipo" onchange="baixarDados()" class="bg-orange-600 text-white font-bold p-1 rounded text-xs uppercase cursor-pointer">
                        <option value="bovino">Bovino</option>
                        <option value="suino">Suíno</option>
                    </select>
                </div>
                
                <div class="space-y-3">
                    <input id="prodNome" type="text" placeholder="Nome da Carne" class="w-full bg-black border border-gray-700 p-3 rounded text-sm">
                    <input id="prodPreco" type="text" placeholder="Preço (0,00)" class="w-full bg-black border border-gray-700 p-3 rounded text-sm">
                    <button id="btn-salvar" onclick="adicionarOferta()" class="w-full bg-orange-600 p-3 rounded font-black uppercase text-sm hover:bg-orange-700 transition-all">Salvar no GitHub</button>
                </div>
                
                <div id="lista-itens" class="space-y-2 max-h-60 overflow-y-auto pt-2 border-t border-gray-800"></div>
            </div>

            <div class="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
                <h3 class="text-blue-500 font-bold text-sm uppercase">Mídias do Monitor</h3>
                <div>
                    <label class="text-[10px] text-gray-400 uppercase">Vídeo Promocional</label>
                    <div class="flex gap-2">
                        <input id="videoInput" type="text" value="churras.mp4" class="flex-grow bg-black border border-gray-700 p-2 rounded text-xs">
                        <button onclick="testarMidia('video')" class="bg-gray-700 px-2 rounded text-[10px]">VER</button>
                        <button onclick="reproduzirVideo()" class="bg-blue-600 px-2 rounded text-[10px]">REPRODUZIR</button>
                    </div>
                </div>
                <video id="preview-video" class="w-full h-32 bg-black rounded-lg border border-gray-700" muted autoplay loop></video>
                <div>
                    <label class="text-[10px] text-gray-400 uppercase">Nome da Logo (Ex: logo.png)</label>
                    <div class="flex gap-2">
                        <input id="logoInput" type="text" value="logo.png" class="flex-grow bg-black border border-gray-700 p-2 rounded text-xs">
                        <button onclick="testarMidia('logo')" class="bg-gray-700 px-2 rounded text-[10px]">VER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MONITOR DE EXIBIÇÃO -->
    <div id="monitor" class="fixed inset-0 flex flex-col p-10">
        <header class="flex justify-between items-center bg-black/60 p-8 rounded-3xl border border-white/10 backdrop-blur-md">
            <img id="mon-logo" src="logo.png" class="h-28 bg-white p-2 rounded-xl">
            <div class="text-right">
                <h2 class="text-7xl font-black italic text-orange-500 leading-none uppercase">OFERTAS <span id="mon-titulo-tipo">BOVINO</span></h2>
                <p id="mon-data" class="text-4xl font-bold text-white mt-2"></p>
            </div>
        </header>
        <div id="mon-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mt-12 flex-grow"></div>
    </div>

    <script>
        let ofertasAtuais = [];
        const TEMPO_EXIBICAO = 15000;
        let editando = null; // Flag para indicar se estamos editando um item

        // SALVAMENTO SEGURO DE CONFIGURAÇÕES
        document.getElementById('ghToken').addEventListener('input', (e) => localStorage.setItem('gh_token', e.target.value));
        document.getElementById('ghRepo').addEventListener('input', (e) => localStorage.setItem('gh_repo', e.target.value));

        async function ghFetch(path, method = 'GET', body = null) {
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('ghRepo').value;
            const statusDiv = document.getElementById('api-status');

            if(!token || !repo) {
                statusDiv.innerHTML = '<span class="log-error">Preencha Token e Repositório!</span>';
                return null;
            }

            const url = `https://api.github.com/repos/${repo}/contents/${path}`;
            const headers = { 
                'Authorization': `token ${token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            };

            try {
                if (method === 'GET') {
                    const r = await fetch(url, { headers });
                    if(!r.ok) throw new Error("Arquivo não encontrado ou erro de acesso.");
                    const data = await r.json();
                    statusDiv.innerHTML = '<span class="log-success">Conectado com sucesso!</span>';
                    return data;
                } else {
                    const atual = await ghFetch(path);
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers,
                        body: JSON.stringify({
                            message: "Atualização via Painel",
                            content: btoa(unescape(encodeURIComponent(JSON.stringify(body, null, 2)))),
                            sha: atual ? atual.sha : null
                        })
                    });
                    if(!res.ok) throw new Error("Erro ao salvar no GitHub.");
                    statusDiv.innerHTML = '<span class="log-success">Salvo com sucesso!</span>';
                    return true;
                }
            } catch (err) {
                statusDiv.innerHTML = `<span class="log-error">ERRO: ${err.message}</span>`;
                return null;
            }
        }

        async function baixarDados() {
            const tipo = document.getElementById('filtroTipo').value;
            const res = await ghFetch(`${tipo}.json`);
            if(res) {
                ofertasAtuais = JSON.parse(decodeURIComponent(escape(atob(res.content))));
                renderizarListaAdm();
            } else {
                ofertasAtuais = [];
                renderizarListaAdm();
            }
        }

        async function adicionarOferta() {
            const btn = document.getElementById('btn-salvar');
            btn.innerText = "SALVANDO...";
            const tipo = document.getElementById('filtroTipo').value;
            const nova = { nome: document.getElementById('prodNome').value, preco: document.getElementById('prodPreco').value };
            
            if(!nova.nome || !nova.preco) return alert("Preencha todos os campos!");
            
            if (editando && editando.tipo === tipo) {
                // Editando um item existente
                ofertasAtuais[editando.index] = nova;
                editando = null;
                btn.innerText = "ATUALIZAR";
            } else {
                // Adicionando novo item
                ofertasAtuais.push(nova);
                btn.innerText = "SALVAR NO GITHUB";
            }
            
            const ok = await ghFetch(`${tipo}.json`, 'PUT', ofertasAtuais);
            if(ok) {
                document.getElementById('prodNome').value = "";
                document.getElementById('prodPreco').value = "";
                renderizarListaAdm();
                salvarLocalmente(); // Salva localmente
            }
            btn.innerText = "SALVAR NO GITHUB";
        }

        async function excluir(i) {
            if(!confirm("Deseja excluir este item?")) return;
            const tipo = document.getElementById('filtroTipo').value;
            ofertasAtuais.splice(i, 1);
            await ghFetch(`${tipo}.json`, 'PUT', ofertasAtuais);
            renderizarListaAdm();
        }

        function editarItem(i) {
            const item = ofertasAtuais[i];
            document.getElementById('prodNome').value = item.nome;
            document.getElementById('prodPreco').value = item.preco;
            
            // Remove o item da lista
            ofertasAtuais.splice(i, 1);
            renderizarListaAdm();
            
            // Altera o texto do botão para "Atualizar"
            document.getElementById('btn-salvar').innerText = "ATUALIZAR";
            
            // Define uma flag para saber que estamos editando
            editando = { index: i, tipo: document.getElementById('filtroTipo').value };
        }

        function renderizarListaAdm() {
            const container = document.getElementById('lista-itens');
            if(ofertasAtuais.length === 0) {
                container.innerHTML = '<p class="text-[10px] text-gray-500 italic">Nenhum item encontrado nesta categoria.</p>';
                return;
            }
            container.innerHTML = ofertasAtuais.map((item, i) => `
                <div class="bg-gray-800 p-2 rounded flex justify-between items-center text-xs border border-gray-700">
                    <span><b>${item.nome}</b> - R$ ${item.preco}</span>
                    <div>
                        <button onclick="editarItem(${i})" class="text-yellow-500 font-bold hover:underline">EDITAR</button>
                        <button onclick="excluir(${i})" class="text-red-500 font-bold hover:underline">REMOVER</button>
                    </div>
                </div>
            `).join('');
        }

        function testarMidia(tipo) {
            const val = tipo === 'video' ? document.getElementById('videoInput').value : document.getElementById('logoInput').value;
            if(tipo === 'video') document.getElementById('preview-video').src = val;
            else alert("A logo será testada ao iniciar o monitor.");
        }

        function iniciarMonitor() {
            if(ofertasAtuais.length === 0) return alert("Adicione preços antes de iniciar!");
            document.getElementById('monitor').style.display = 'flex';
            document.getElementById('mon-logo').src = document.getElementById('logoInput').value;
            document.getElementById('mon-data').innerText = new Date().toLocaleDateString('pt-BR');
            document.documentElement.requestFullscreen().catch(() => {});
            cicloMonitor();
        }

        function cicloMonitor() {
            const tipo = document.getElementById('filtroTipo').value;
            document.getElementById('mon-titulo-tipo').innerText = tipo;
            
            document.getElementById('mon-grid').innerHTML = ofertasAtuais.slice(0, 8).map(item => `
                <div class="bg-white p-6 rounded-3xl shadow-2xl text-center border-b-[15px] border-orange-600 animate-pulse">
                    <h3 class="text-slate-900 text-4xl font-black uppercase h-24 flex items-center justify-center leading-none">${item.nome}</h3>
                    <div class="my-6">
                        <span class="text-orange-600 text-2xl font-bold">R$</span>
                        <span class="preco-valor text-9xl font-black text-slate-900 tracking-tighter">${item.preco}</span>
                    </div>
                </div>
            `).join('');

            setTimeout(iniciarVideo, TEMPO_EXIBICAO);
        }

        function iniciarVideo() {
            const v = document.getElementById('monitor-video');
            const m = document.getElementById('monitor');
            v.src = document.getElementById('videoInput').value;
            v.classList.remove('hidden');
            m.classList.add('hidden');
            v.play().catch(() => {});

            v.onended = () => {
                v.classList.add('hidden');
                m.classList.remove('hidden');
                cicloMonitor();
            };
        }

        function reproduzirVideo() {
            const video = document.getElementById('preview-video');
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function salvarLocalmente() {
            localStorage.setItem('ofertasAtuais', JSON.stringify(ofertasAtuais));
        }

        function carregarLocalmente() {
            const dados = localStorage.getItem('ofertasAtuais');
            if(dados) {
                try {
                    ofertasAtuais = JSON.parse(dados);
                } catch(e) {
                    console.error("Erro ao carregar dados locais:", e);
                }
            }
        }

        window.onload = () => {
            const t = localStorage.getItem('gh_token');
            const r = localStorage.getItem('gh_repo');
            if(t) document.getElementById('ghToken').value = t;
            if(r) document.getElementById('ghRepo').value = r;
            if(t && r) {
                baixarDados();
            } else {
                carregarLocalmente(); // Tenta carregar dados locais
                renderizarListaAdm();
            }
        };

        async function sincronizarGitHub() {
            const tipo = document.getElementById('filtroTipo').value;
            const token = document.getElementById('ghToken').value;
            const repo = document.getElementById('ghRepo').value;
            
            if (!token || !repo) {
                alert("Preencha Token e Repositório!");
                return;
            }
            
            if (ofertasAtuais.length === 0) {
                alert("Não há dados para sincronizar!");
                return;
            }
            
            try {
                const resposta = await ghFetch(`${tipo}.json`, 'PUT', ofertasAtuais);
                if (resposta) {
                    alert("Dados sincronizados com sucesso!");
                    renderizarListaAdm();
                }
            } catch (error) {
                console.error("Erro ao sincronizar:", error);
                alert("Erro ao sincronizar com o GitHub.");
            }
        }
    </script>
</body>
</html>
