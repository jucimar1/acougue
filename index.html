<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Profissional de Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com');
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
                        url('https://images.unsplash.com') center/cover fixed;
        }
        .no-display { display: none !important; }
        .promo-card { background: rgba(255, 255, 255, 0.98); border-bottom: 8px solid #f97316; }
        #app-container:-webkit-full-screen { width: 100%; height: 100%; padding: 40px; overflow-y: auto; background: inherit; }
    </style>
</head>
<body class="text-white min-h-screen">

    <!-- GESTOR (OCULTO EM TELA CHEIA) -->
    <div id="admin-panel" class="bg-zinc-900 border-b-2 border-orange-600 p-6 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black text-orange-500 uppercase">Gerenciador de Preços</h1>
                <div class="flex gap-4">
                    <label class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-lg cursor-pointer font-bold text-xs border border-zinc-600 transition">
                        🖼️ TROCAR LOGO
                        <input type="file" id="logoInput" accept="image/*" class="hidden" onchange="handleLogo(this)">
                    </label>
                    <button onclick="launchTV()" class="bg-orange-600 hover:bg-orange-500 px-6 py-2 rounded-full font-black text-sm uppercase">
                        📺 INICIAR PAINEL DIGITAL (F11)
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- FORMULÁRIO -->
                <div class="bg-zinc-800 p-4 rounded-xl space-y-3">
                    <h3 class="text-orange-500 font-bold uppercase text-xs">Novo Produto</h3>
                    <input id="pNome" type="text" placeholder="Nome do Produto" class="w-full bg-zinc-900 p-2 rounded border border-zinc-700 text-sm">
                    <div class="flex gap-2">
                        <input id="pPreco" type="text" placeholder="Preço" class="w-full bg-zinc-900 p-2 rounded border border-zinc-700 text-sm">
                        <input id="pUnid" type="text" placeholder="Kg" class="w-32 bg-zinc-900 p-2 rounded border border-zinc-700 text-sm">
                    </div>
                    <button onclick="addItem()" class="w-full bg-orange-600 font-black py-2 rounded uppercase text-sm">Cadastrar</button>
                </div>

                <!-- LISTA DE EDIÇÃO/DELETE -->
                <div class="lg:col-span-2 bg-zinc-800 p-4 rounded-xl max-h-48 overflow-y-auto">
                    <h3 class="text-orange-500 font-bold uppercase text-xs mb-3">Lista de Ofertas Ativas</h3>
                    <div id="admin-list" class="space-y-2">
                        <!-- Itens aparecem aqui para editar/deletar -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAINEL DE EXIBIÇÃO (TV) -->
    <div id="app-container" class="max-w-7xl mx-auto p-8">
        <header class="flex justify-between items-center mb-16 border-b-4 border-orange-600 pb-10">
            <div class="flex items-center gap-8">
                <img id="logo-preview" src="" class="max-h-24 max-w-[250px] object-contain hidden">
                <div id="logo-empty" class="bg-orange-600 w-20 h-20 rounded-2xl flex items-center justify-center text-4xl shadow-xl">🥩</div>
                <div>
                    <h2 class="text-7xl font-black uppercase italic tracking-tighter leading-none">CORTES <span class="text-orange-500">SUINOS</span></h2>
                    <p class="text-2xl text-zinc-300 font-bold uppercase tracking-widest mt-1">Promoção de carne</p>
                </div>
            </div>
            <div class="text-right">
                <p id="data-txt" class="text-4xl font-black text-white"></p>
                <p class="text-orange-500 font-bold uppercase">Oferta do Dia</p>
            </div>
        </header>

        <!-- GRID DE OFERTAS LIMPO (SEM BOTÕES) -->
        <div id="display-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('ads_v3')) || [];

        function save() { 
            localStorage.setItem('ads_v3', JSON.stringify(db)); 
            render(); 
        }

        function addItem() {
            const n = document.getElementById('pNome').value;
            const p = document.getElementById('pPreco').value;
            const u = document.getElementById('pUnid').value || 'kg';
            if(n && p) {
                db.push({ n, p, u });
                save();
                document.getElementById('pNome').value = '';
                document.getElementById('pPreco').value = '';
            }
        }

        function editItem(i) {
            const n = prompt("Nome do Produto:", db[i].n);
            const p = prompt("Preço:", db[i].p);
            if (n && p) { db[i].n = n; db[i].p = p; save(); }
        }

        function deleteItem(i) {
            if(confirm("Deseja remover esta oferta?")) { db.splice(i, 1); save(); }
        }

        function handleLogo(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    localStorage.setItem('logo_v3', e.target.result);
                    loadLogo();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function loadLogo() {
            const data = localStorage.getItem('logo_v3');
            if(data) {
                document.getElementById('logo-preview').src = data;
                document.getElementById('logo-preview').classList.remove('hidden');
                document.getElementById('logo-empty').classList.add('hidden');
            }
        }

        function launchTV() {
            document.documentElement.requestFullscreen();
            document.getElementById('admin-panel').classList.add('no-display');
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) document.getElementById('admin-panel').classList.remove('no-display');
        });

        function render() {
            // Renderiza o Painel da TV (Limpo)
            const grid = document.getElementById('display-grid');
            grid.innerHTML = db.map(item => `
                <div class="promo-card text-zinc-900 rounded-[2.5rem] shadow-2xl overflow-hidden relative border-4 border-white">
                    <div class="p-8">
                        <h3 class="text-4xl font-black uppercase mb-4 h-20 overflow-hidden leading-tight border-b-2 border-zinc-100">${item.n}</h3>
                        <div class="flex items-start">
                            <span class="text-2xl font-black text-orange-600 mt-2 mr-1">R$</span>
                            <span class="text-8xl font-black tracking-tighter leading-none">${item.p}</span>
                            <span class="text-2xl font-bold text-zinc-400 self-end mb-2 ml-1">/${item.u}</span>
                        </div>
                    </div>
                    <div class="bg-orange-600 py-3 px-6 text-center text-white font-black italic text-xl tracking-widest uppercase">
                        OFERTA IMPERDÍVEL
                    </div>
                </div>
            `).join('');

            // Renderiza a Lista de Gestão (Com botões)
            const list = document.getElementById('admin-list');
            list.innerHTML = db.map((item, i) => `
                <div class="flex justify-between items-center bg-zinc-900 p-2 rounded-lg border border-zinc-700">
                    <span class="text-sm font-bold">${item.n} - R$ ${item.p}</span>
                    <div class="flex gap-2">
                        <button onclick="editItem(${i})" class="bg-blue-600 text-[10px] px-3 py-1 rounded font-bold">EDITAR</button>
                        <button onclick="deleteItem(${i})" class="bg-red-600 text-[10px] px-3 py-1 rounded font-bold">EXCLUIR</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('data-txt').innerText = new Date().toLocaleDateString('pt-BR');
        loadLogo();
        render();

        // Scroll Automático
        setInterval(() => {
            if(document.fullscreenElement) {
                const el = document.documentElement;
                if (el.scrollTop + el.clientHeight >= el.scrollHeight - 20) {
                    window.scrollTo({top: 0, behavior: 'smooth'});
                } else {
                    window.scrollBy({top: 400, behavior: 'smooth'});
                }
            }
        }, 8000);
    </script>
</body>
</html>
